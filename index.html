<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#071018" />
<link rel="manifest" href="manifest.webmanifest" />
<title>APEX HORIZON</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #f4f1ea; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui * { pointer-events: auto; }
  button, .card { font: inherit; color: inherit; }
  button { border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  #boot, #menu, #garage, #results {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 70% 10%, #1c3148 0%, #07080c 55%);
    padding: 16px 18px 18px;
    gap: 10px;
  }
  .brand { letter-spacing: 0.42em; font-size: 12px; color: #f0b429; font-weight: 700; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 54px); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; }
  h1 span { color: #f0b429; }
  .sub { opacity: 0.72; font-size: 13px; max-width: 520px; text-align: center; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: #f0b429; color: #14120c; font-weight: 800; letter-spacing: 0.08em;
    padding: 12px 18px; border-radius: 999px; text-transform: uppercase; font-size: 13px;
  }
  .btn.ghost { background: transparent; color: #f4f1ea; border: 1px solid rgba(255,255,255,0.25); }
  .btn:active { transform: scale(0.98); }

  #garage { align-items: stretch; justify-content: flex-start; padding-top: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .cr { font-variant-numeric: tabular-nums; color: #f0b429; font-weight: 800; }
  .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 12px; width: min(920px, 100%); margin: 0 auto; }
  .card {
    background: rgba(8,12,18,0.72); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 12px;
  }
  .cars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .car {
    text-align: left; background: #10161f; border-radius: 12px; padding: 10px; border: 1px solid transparent;
  }
  .car.on { border-color: #f0b429; }
  .car b { display: block; }
  .pi { float: right; color: #f0b429; font-size: 12px; }
  .stat { height: 6px; background: #1c2430; border-radius: 99px; margin: 6px 0; overflow: hidden; }
  .stat i { display: block; height: 100%; background: linear-gradient(90deg, #f0b429, #fff1c2); }
  .up { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  .tracks { display: flex; gap: 8px; }
  .tracks button { flex: 1; background: #10161f; border-radius: 12px; padding: 10px; border: 1px solid transparent; text-align: left; }
  .tracks button.on { border-color: #7fd0ff; }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud .bit { pointer-events: none; position: absolute; text-shadow: 0 2px 10px #000; }
  #speed { left: 16px; bottom: 16px; font-size: 42px; font-weight: 800; line-height: 0.8; }
  #speed small { font-size: 12px; letter-spacing: 0.14em; opacity: 0.7; }
  #gear { left: 118px; bottom: 22px; width: 36px; height: 36px; border-radius: 8px; border: 2px solid #f0b429;
    display: flex; align-items: center; justify-content: center; font-weight: 800; }
  #lap { right: 16px; top: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  #lap b { font-size: 20px; }
  #pos { left: 16px; top: 14px; font-size: 28px; font-weight: 800; }
  #pos small { font-size: 12px; opacity: 0.7; }
  #rpm { left: 16px; bottom: 68px; width: 160px; height: 8px; background: rgba(0,0,0,0.45); border-radius: 99px; overflow: hidden; }
  #rpm i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3dff9a, #f0b429 70%, #ff4d4d); }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 140px; height: 140px; border-radius: 12px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12); }
  #msg { left: 50%; top: 18%; transform: translateX(-50%); font-size: 42px; font-weight: 900; letter-spacing: 0.08em; }
  #controls { position: absolute; inset: 0; pointer-events: none; }
  #steerZone { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; pointer-events: auto; }
  #pedal { position: absolute; right: 18px; bottom: 18px; width: 92px; height: 92px; border-radius: 50%;
    background: rgba(240,180,41,0.9); color: #14120c; font-weight: 900; pointer-events: auto; }
  #brake, #hb, #tilt, #auto, #pause {
    position: absolute; pointer-events: auto; border-radius: 12px; background: rgba(10,12,16,0.55);
    border: 1px solid rgba(255,255,255,0.16); color: #fff; font-weight: 800; padding: 10px 12px;
  }
  #brake { right: 124px; bottom: 28px; }
  #hb { right: 124px; bottom: 78px; }
  #tilt { left: 16px; top: 64px; font-size: 12px; }
  #auto { left: 92px; top: 64px; font-size: 12px; }
  #pause { right: 16px; top: 64px; font-size: 12px; }
  #results { background: rgba(5,7,10,0.78); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 4px 10px; }
  .me { color: #f0b429; font-weight: 800; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <section id="boot">
    <div class="brand">FESTIVAL SERIES</div>
    <h1>APEX <span>HORIZON</span></h1>
    <p class="sub">Road racing built for a phone. Grip, gearing, a full grid, and a garage that remembers you.</p>
    <div class="row">
      <button class="btn" id="goGarage">Enter festival</button>
    </div>
    <p class="sub">Landscape. Gas on the right, steer on the left, or tilt the phone.</p>
  </section>

  <section id="garage" class="hidden">
    <div class="topbar">
      <div class="brand">GARAGE</div>
      <div class="cr" id="credits">CR 0</div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="cars" id="carList"></div>
      </div>
      <div class="card">
        <div id="carName" style="font-size:22px;font-weight:800"></div>
        <div id="carMeta" class="sub" style="text-align:left"></div>
        <div id="stats"></div>
        <div id="upgrades"></div>
        <div class="tracks" id="trackList" style="margin-top:12px"></div>
        <div class="row" style="margin-top:12px;justify-content:flex-end">
          <button class="btn" id="raceBtn">Race</button>
        </div>
      </div>
    </div>
  </section>

  <div id="hud" class="hidden">
    <div class="bit" id="pos">1<small>/8</small></div>
    <div class="bit" id="lap"><b>1:00.00</b><div id="best">BEST --</div></div>
    <div class="bit" id="rpm"><i></i></div>
    <div class="bit" id="speed">0<small> KM/H</small></div>
    <div class="bit" id="gear">N</div>
    <div class="bit" id="msg"></div>
    <canvas class="bit" id="minimap" width="140" height="140"></canvas>
    <div id="controls">
      <div id="steerZone"></div>
      <button id="pedal">GAS</button>
      <button id="brake">BRAKE</button>
      <button id="hb">HB</button>
      <button id="tilt">TILT</button>
      <button id="auto">AUTO</button>
      <button id="pause">PIT</button>
    </div>
  </div>

  <section id="results" class="hidden">
    <div class="brand">CHECKERED</div>
    <h1 id="placeLine">P1</h1>
    <div id="board"></div>
    <div class="row">
      <button class="btn" id="again">Rematch</button>
      <button class="btn ghost" id="toGarage">Garage</button>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
